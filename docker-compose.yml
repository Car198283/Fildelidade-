version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: bartcellos_db
    environment:
      POSTGRES_USER: bartcellos
      POSTGRES_PASSWORD: bartcellos_password
      POSTGRES_DB: bartcellos_loyalty
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bartcellos"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: bartcellos_backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://bartcellos:bartcellos_password@postgres:5432/bartcellos_loyalty
      SECRET_KEY: sua-chave-secreta-mude-em-producao
      DEBUG: "False"
      API_HOST: 0.0.0.0
      API_PORT: 8000
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    container_name: bartcellos_frontend
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://backend:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev

volumes:
  postgres_data:
