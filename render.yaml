databases:
  - name: fidelidade-db
    plan: free
    databaseName: fidelidade
    user: fidelidade

services:
  - type: web
    name: fidelidade-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fidelidade-db
          property: connectionString
      - key: DB_TYPE
        value: postgresql
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "False"
      - key: CORS_ORIGINS
        value: https://fidelidade-web.onrender.com
      - key: SECRET_KEY
        generateValue: true
      - key: MASTER_EMAIL
        value: cadufcosta@yahoo.com.br
      - key: MASTER_PASSWORD
        sync: false
      - key: N8N_WEBHOOK_SECRET
        sync: false
      - key: META_WEBHOOK_VERIFY_TOKEN
        sync: false
      - key: META_APP_SECRET
        sync: false

  - type: web
    name: fidelidade-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: "/*"
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://fidelidade-api-4tsn.onrender.com
